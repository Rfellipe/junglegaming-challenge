name: jungle-challenge

x-app: &app
  image: jungle-challenge:local
  build: .
  init: true

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering-local
      POSTGRES_DB: wagering
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/jungle-realm.json:/opt/keycloak/data/import/jungle-realm.json:ro
      - ./deploy/keycloak/quarkus.properties:/opt/keycloak/conf/quarkus.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 40

  localstack:
    image: localstack/localstack:4.9.0
    environment:
      SERVICES: sqs,iam
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: dynamic
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/queues-ready && awslocal sqs get-queue-url --queue-name wager-events.fifo > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    <<: *app
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering-local@postgres:5432/wagering?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://wagering:wagering-local@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_ENDPOINT: http://localstack:4566
      OIDC_ISSUER_URL: http://localhost:8081/realms/jungle
      OIDC_BACKCHANNEL_URL: http://keycloak:8080
      OIDC_AUDIENCE: wagering-api
      DEPENDENCY_TIMEOUT: ${DEPENDENCY_TIMEOUT:-3s}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
